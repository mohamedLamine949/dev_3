<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Market — Carte de fin (CTA statique 9:16)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --green:   #16a34a;
    --green-l: #22c55e;
    --mint:    #7cf0a8;
    --ink:     #06210f;
  }
  html, body {
    background: #05140b;
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
  }

  /* ===== Carte 9:16 exacte : 1080 x 1920 (capture cette zone) ===== */
  .card {
    position: relative;
    width: 1080px; height: 1920px;
    overflow: hidden;
    background:
      radial-gradient(130% 80% at 50% -8%, #1f7a43 0%, #0d4423 42%, #06210f 100%);
    display: flex; flex-direction: column; align-items: center;
    isolation: isolate;
  }

  /* Halos statiques */
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); z-index: 0; pointer-events: none; }
  .glow.a { width: 720px; height: 720px; background: #22c55e; opacity: .38; top: -240px; left: -180px; }
  .glow.b { width: 640px; height: 640px; background: #0e8a4a; opacity: .30; bottom: -220px; right: -160px; }
  .glow.c { width: 460px; height: 460px; background: #eab308; opacity: .10; top: 46%; left: 34%; }

  /* Grille technique subtile */
  .grid {
    position: absolute; inset: 0; z-index: 0; opacity: .10;
    background-image: linear-gradient(#fff 1px, transparent 1px), linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 84px 84px;
    -webkit-mask-image: radial-gradient(72% 58% at 50% 40%, #000 32%, transparent 78%);
            mask-image: radial-gradient(72% 58% at 50% 40%, #000 32%, transparent 78%);
  }

  /* ===== Marque (haut) ===== */
  .brand { z-index: 5; display: flex; align-items: center; gap: 20px; margin-top: 96px; }
  .brand .logo {
    width: 78px; height: 78px; border-radius: 20px;
    background: linear-gradient(160deg, #26c05e, #128a3e);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 30px rgba(22,163,74,.45), 0 0 0 1px rgba(255,255,255,.08) inset;
  }
  .brand .logo svg { width: 44px; height: 44px; }
  .brand b { font-size: 46px; font-weight: 800; letter-spacing: -.5px; }

  /* ===== Téléphone ===== */
  .phone-wrap { z-index: 3; margin-top: 70px; position: relative; }
  .phone-wrap::before { /* halo derrière le téléphone */
    content: ''; position: absolute; inset: -60px -40px; z-index: -1;
    background: radial-gradient(50% 45% at 50% 45%, rgba(124,240,168,.35), transparent 70%);
    filter: blur(30px);
  }
  .phone {
    width: 452px; aspect-ratio: 1170 / 2532;
    background: #0a0a0a; border-radius: 56px; padding: 11px;
    box-shadow: 0 40px 90px rgba(0,0,0,.55), 0 0 0 2px rgba(255,255,255,.07) inset;
    transform: rotate(-1deg);
  }
  .phone-screen { position: relative; width: 100%; height: 100%; border-radius: 45px; overflow: hidden; background: #fff; }
  .phone-screen img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .phone-screen::after { /* reflet vitre */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(118deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 30%);
  }
  /* encoche */
  .phone-screen::before {
    content: ''; position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 30px; background: #0a0a0a; border-radius: 16px; z-index: 3;
  }

  /* ===== Bloc texte + CTA (bas) ===== */
  .foot { z-index: 5; margin-top: auto; width: 100%; padding: 0 80px 96px;
    text-align: center; display: flex; flex-direction: column; align-items: center; }

  .pill { display: inline-flex; align-items: center; gap: 10px;
    background: rgba(124,240,168,.12); border: 1px solid rgba(124,240,168,.35);
    color: var(--mint); font-weight: 700; font-size: 24px; letter-spacing: .2px;
    padding: 12px 24px; border-radius: 999px; margin-bottom: 34px; }

  .foot h2 { font-size: 74px; font-weight: 800; line-height: 1.08; letter-spacing: -1px;
    text-shadow: 0 6px 26px rgba(0,0,0,.4); }
  .foot h2 .accent { color: var(--mint); }

  .badges { display: flex; flex-direction: column; gap: 20px; margin-top: 52px; width: 100%; align-items: center; }
  .store-badge { display: inline-flex; align-items: center; gap: 20px;
    background: #000; border: 2px solid rgba(255,255,255,.22); border-radius: 22px;
    padding: 22px 42px; width: 520px; justify-content: center; }
  .store-badge svg { width: 44px; height: 44px; fill: #fff; flex: none; }
  .store-badge span { text-align: left; line-height: 1.15; }
  .store-badge span small { display: block; font-size: 20px; opacity: .82; font-weight: 600; }
  .store-badge span b { font-size: 30px; font-weight: 700; }
  .store-badge.soon { opacity: .8; }

  .url { margin-top: 44px; font-size: 32px; font-weight: 700; color: var(--mint); letter-spacing: .3px; }

  /* Aide écran (non capturée si tu recadres sur .card) */
  .hint { position: fixed; bottom: 10px; left: 10px; font-size: 12px; color: #6b7d72;
    font-family: system-ui, sans-serif; z-index: 99; }
  @media print { .hint { display: none; } }
</style>
</head>
<body>

  <div class="card" id="card">
    <div class="glow a"></div><div class="glow b"></div><div class="glow c"></div>
    <div class="grid"></div>

    <!-- Marque -->
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 7h12l1 13H5L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/>
          <path d="m12.6 10-2.1 3.4h1.7l-.7 3.2 2.9-4h-1.7l.9-2.6Z" fill="#fff" stroke="none"/>
        </svg>
      </span>
      <b>Flash Market</b>
    </div>

    <!-- Téléphone -->
    <div class="phone-wrap">
      <div class="phone">
        <div class="phone-screen">
          <img src="screens/chat.png" alt="Aperçu de l'app Flash Market">
        </div>
      </div>
    </div>

    <!-- Texte + CTA -->
    <div class="foot">
      <span class="pill">🇲🇱 La marketplace #1 au Mali</span>
      <h2>Télécharge <span class="accent">Flash&nbsp;Market</span><br>et commence à vendre</h2>

      <div class="badges">
        <span class="store-badge">
          <svg viewBox="0 0 24 24"><path d="M16.4 1.4c0 1.1-.5 2.3-1.2 3.1-.7.9-2 1.6-3 1.5-.1-1.1.5-2.3 1.2-3 .8-.9 2.1-1.6 3-1.6Zm4.5 15.7c-.5 1.2-1 1.9-1.7 2.9-1 1.4-2.4 3.2-4 3.2-1.5 0-1.9-.9-3.6-.9s-2.3.9-3.7.9c-1.6 0-2.8-1.6-3.8-3-2.1-3-3.4-7.5-1.4-10.6 1-1.5 2.7-2.5 4.3-2.5 1.5 0 2.5 1 3.6 1 1.1 0 1.9-1 3.7-1 1.4 0 2.9.8 3.9 2.1-3.4 1.9-2.9 6.8.7 7.9Z"/></svg>
          <span><small>Disponible sur</small><b>l'App&nbsp;Store</b></span>
        </span>
        <span class="store-badge soon">
          <svg viewBox="0 0 24 24"><path d="M3.6 2.3 13 12 3.6 21.7c-.4-.2-.6-.6-.6-1.1V3.4c0-.5.2-.9.6-1.1Zm10.9 8.9 2.9 2.9-3.4 1.9-2.4-2.4 2.9-2.4Zm-2.9-.2L8.7 8.1l6.1-3.5 1.9 1.1-4.2 5.3Zm0 2.4 1.8 2.3-6.2 3.5-1.8-1 6.2-4.8Z"/></svg>
          <span><small>Bientôt sur</small><b>Google&nbsp;Play</b></span>
        </span>
      </div>

      <div class="url">app-flashmarket.com</div>
    </div>
  </div>

  <div class="hint">Capture la carte en 1080×1920 (DevTools → capture node, ou screenshot). Ouvre cta-endcard.html?screen=home / search pour changer l'écran.</div>

<script>
  // Permet de changer le screenshot affiché : ?screen=home | search | chat (défaut chat)
  const s = new URLSearchParams(location.search).get('screen');
  if (s) document.querySelector('.phone-screen img').src = 'screens/' + s + '.png';
</script>
</body>
</html>
